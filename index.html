<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>Canvas 測試</title>
</head>
<body>
  <h3>Canvas 測試：應該看到一個藍色圓形</h3>
  <canvas id="c" width="200" height="200" style="border:1px solid #000;"></canvas>

  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    if (!ctx) {
      alert('getContext 失敗');
    } else {
      ctx.fillStyle = 'blue';
      ctx.beginPath();
      ctx.arc(100, 100, 50, 0, Math.PI * 2);
      ctx.fill();
    }
  </script>
</body>
</html>
