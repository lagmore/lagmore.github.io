<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>表情切換人臉</title>
<style>
  body {
    font-family: sans-serif;
    text-align: center;
    background: #f0f0f0;
  }
  .btns {
    margin: 20px 0;
  }
  button {
    margin: 0 5px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .face {
    position: relative;
    margin: 0 auto;
    width: 200px;
    height: 200px;
    background: #ffe0a3;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(0,0,0,.2);
  }
  .eye {
    position: absolute;
    top: 65px;
    width: 25px;
    height: 25px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 0 3px #333;
  }
  .eye::after {
    content: "";
    position: absolute;
    left: 7px;
    top: 7px;
    width: 11px;
    height: 11px;
    background: #333;
    border-radius: 50%;
  }
  .eye.left  { left: 55px; }
  .eye.right { right: 55px; }

  .mouth {
    position: absolute;
    left: 50%;
    top: 125px;
    width: 100px;
    height: 60px;
    margin-left: -50px;
    border: 5px solid #333;
    border-color: #333 transparent transparent transparent; /* 預設：笑 */
    border-radius: 0 0 80px 80px;
    box-sizing: border-box;
    transform-origin: center top;
  }

  /* 各種表情 */
  .happy  { border-color: #333 transparent transparent transparent; border-radius: 0 0 80px 80px; transform: scaleY(1); }
  .sad    { border-color: transparent transparent #333 transparent; border-radius: 80px 80px 0 0; transform: translateY(10px); }
  .angry  { border-color: transparent transparent #333 transparent; border-radius: 0; transform: rotate(-10deg); }
  .neutral{ border-color: #333 transparent transparent transparent; border-radius: 0; transform: rotate(0deg) scaleY(0.2); }

  /* 眉毛加強怒、哀 */
  .brow {
    position: absolute;
    width: 50px;
    height: 6px;
    background: #333;
    top: 45px;
    border-radius: 3px;
    transition: transform .2s;
  }
  .brow.left  { left: 45px;  }
  .brow.right { right: 45px; }

  .face.angry .brow.left  { transform: rotate(-20deg) translateY(3px); }
  .face.angry .brow.right { transform: rotate(20deg)  translateY(3px); }
  .face.sad   .brow.left  { transform: rotate(15deg); }
  .face.sad   .brow.right { transform: rotate(-15deg); }
</style>
</head>
<body>

<h2>人臉表情示範（類 Flash 效果）</h2>

<div class="btns">
  <button onclick="setMood('happy')">喜</button>
  <button onclick="setMood('angry')">怒</button>
  <button onclick="setMood('sad')">哀</button>
  <button onclick="setMood('neutral')">樂 / 平靜</button>
</div>

<div id="face" class="face happy">
  <div class="brow left"></div>
  <div class="brow right"></div>
  <div class="eye left"></div>
  <div class="eye right"></div>
  <div id="mouth" class="mouth happy"></div>
</div>

<script>
  function setMood(mood) {
    const face  = document.getElementById('face');
    const mouth = document.getElementById('mouth');
    face.className = 'face ' + mood;
    mouth.className = 'mouth ' + mood;
  }
</script>

</body>
</html>
