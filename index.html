<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Canvas 表情人臉</title>
<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
    background: #f5f5f5;
  }
  #wrap {
    margin-top: 30px;
  }
  canvas {
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  .btns {
    margin-top: 16px;
  }
  button {
    margin: 0 6px;
    padding: 8px 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
<h2>HTML5 Canvas 人臉表情示範</h2>

<div id="wrap">
  <canvas id="faceCanvas" width="300" height="300"></canvas>
  <div class="btns">
    <button onclick="setMood('happy')">喜</button>
    <button onclick="setMood('angry')">怒</button>
    <button onclick="setMood('sad')">哀</button>
    <button onclick="setMood('neutral')">樂 / 平靜</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('faceCanvas');
  const ctx = canvas.getContext('2d');

  function drawFace(mood) {
    const cx = 150, cy = 150, r = 100;

    // 清空畫布
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 頭
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffe0a3';
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.stroke();

    // 眼睛
    drawEye(cx - 40, cy - 25);
    drawEye(cx + 40, cy - 25);

    // 眉毛
    drawBrows(mood, cx, cy);

    // 嘴巴
    drawMouth(mood, cx, cy + 35);
  }

  function drawEye(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 12, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#333';
    ctx.fill();
  }

  function drawBrows(mood, cx, cy) {
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 4;
    const y = cy - 55;
    let leftStart = [cx - 70, y];
    let leftEnd   = [cx - 20, y];
    let rightStart = [cx + 20, y];
    let rightEnd   = [cx + 70, y];

    if (mood === 'angry') {
      leftStart[1]  = y + 5;
      leftEnd[1]    = y - 5;
      rightStart[1] = y - 5;
      rightEnd[1]   = y + 5;
    } else if (mood === 'sad') {
      leftStart[1]  = y - 5;
      leftEnd[1]    = y + 5;
      rightStart[1] = y + 5;
      rightEnd[1]   = y - 5;
    }

    ctx.beginPath();
    ctx.moveTo(...leftStart);
    ctx.lineTo(...leftEnd);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(...rightStart);
    ctx.lineTo(...rightEnd);
    ctx.stroke();
  }

  function drawMouth(mood, cx, cy) {
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 5;
    ctx.beginPath();

    if (mood === 'happy') {
      // 微笑弧線
      ctx.arc(cx, cy, 45, 0.15 * Math.PI, 0.85 * Math.PI, false);
    } else if (mood === 'sad') {
      // 反向弧線
      ctx.arc(cx, cy + 30, 45, 1.15 * Math.PI, 1.85 * Math.PI, true);
    } else if (mood === 'angry') {
      // 斜線嘴
      ctx.moveTo(cx - 30, cy + 20);
      ctx.lineTo(cx + 30, cy + 5);
    } else {
      // 中性直線
      ctx.moveTo(cx - 30, cy + 15);
      ctx.lineTo(cx + 30, cy + 15);
    }
    ctx.stroke();
  }

  function setMood(mood) {
    drawFace(mood);
  }

  // 預設畫出「喜」
  drawFace('happy');
</script>
</body>
</html>
